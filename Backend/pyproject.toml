[project]
name = "tf-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "tf-agent",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "typer>=0.13",
]

[project.scripts]
tf = "tf_backend.cli:app"

[tool.uv.sources]
tf-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tf_backend"]
