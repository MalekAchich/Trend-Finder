[project]
name = "tf-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "tf-db",
  "httpx>=0.28",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "yt-dlp>=2026.3.13",
  "trafilatura>=2.0",
  "opencv-python-headless>=4.10",
  "mediapipe>=0.10.14",
  "faster-whisper>=1.1",
  "pillow>=11",
  "imagehash>=4.3",
  "numpy>=1.26",
  "curl-cffi>=0.10",
  "playwright>=1.55",
]

[tool.uv.sources]
tf-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tf_agent"]
