[project]
name = "tf-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "tf-db",
  "httpx>=0.28",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
]

[tool.uv.sources]
tf-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tf_agent"]
