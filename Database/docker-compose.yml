name: trendfinder
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: tf
      POSTGRES_PASSWORD: tf
      POSTGRES_DB: trendfinder
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - tf_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tf -d trendfinder"]
      interval: 5s
      timeout: 3s
      retries: 20
  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-trendfinder-local-only}
      SEARXNG_BASE_URL: http://localhost:8888/
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ../config/searxng:/etc/searxng
    restart: unless-stopped
volumes:
  tf_pgdata: {}
