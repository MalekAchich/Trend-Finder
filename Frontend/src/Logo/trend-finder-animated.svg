<title id="tf-logo-title">Trend Finder animated logo</title>
<style>
.tf-ring{stroke-dasharray:200.8001;animation:tf-ring-in 1.1s .06s cubic-bezier(.16,1,.3,1) both}
.tf-trend{stroke-dasharray:60.1119;animation:tf-trend-in 1.05s .4s cubic-bezier(.16,1,.3,1) both}
.tf-head{transform-box:fill-box;transform-origin:center;animation:tf-head-in .42s 1.03s cubic-bezier(.16,1,.3,1) both}
.tf-dot{transform-box:fill-box;transform-origin:center;animation:tf-dot-in .4s 1.18s cubic-bezier(.16,1,.3,1) both,tf-dot-pulse 3.6s 1.6s ease-in-out infinite}
.tf-runner{opacity:0;animation:tf-runner-in 1.05s .4s linear both}
.tf-sweep{stroke-dasharray:24 260;opacity:0;animation:tf-sweep-in 1.35s .12s linear both,tf-sweep-idle 6s 3.25s linear infinite}
.tf-ping{transform-box:fill-box;transform-origin:center;opacity:0;animation:tf-ping 3.6s 1.6s ease-out infinite}
.tf-wordmark-enter{animation:tf-type-in .7s .24s cubic-bezier(.16,1,.3,1) both}
.tf-shine{opacity:0;animation:tf-shine-in 1.2s 1.5s ease-in-out both}
@keyframes tf-ring-in{from{stroke-dashoffset:200.8001;opacity:.35}to{stroke-dashoffset:0;opacity:1}}
@keyframes tf-trend-in{from{stroke-dashoffset:60.1119;opacity:.3}to{stroke-dashoffset:0;opacity:1}}
@keyframes tf-head-in{0%{opacity:0;transform:scale(.72)}65%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes tf-dot-in{from{opacity:0}to{opacity:1}}
@keyframes tf-dot-pulse{0%,30%,100%{transform:scale(1)}9%{transform:scale(1.16)}}
@keyframes tf-runner-in{0%{opacity:0;transform:translate(29px,61px)}4%{opacity:.9}27.1%{transform:translate(40.5px,49.5px)}47.1%{transform:translate(49px,58px)}92%{opacity:.95}100%{opacity:0;transform:translate(71px,35px)}}
@keyframes tf-sweep-in{0%{stroke-dashoffset:24;opacity:0}8%{opacity:.8}88%{opacity:.8}100%{stroke-dashoffset:-224.8001;opacity:0}}
@keyframes tf-sweep-idle{0%{stroke-dashoffset:24;opacity:0}1%{opacity:.58}20%{stroke-dashoffset:-224.8001;opacity:0}100%{stroke-dashoffset:-224.8001;opacity:0}}
@keyframes tf-ping{0%{transform:scale(.82);opacity:.5}30%,100%{transform:scale(3.15);opacity:0}}
@keyframes tf-type-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes tf-shine-in{0%{opacity:0;transform:translateX(-100px)}12%{opacity:.45}80%{opacity:.45}100%{opacity:0;transform:translateX(486px)}}
@media (prefers-reduced-motion:reduce){.tf-ring,.tf-trend,.tf-head,.tf-dot,.tf-runner,.tf-sweep,.tf-ping,.tf-wordmark-enter,.tf-shine{animation:none!important}.tf-runner,.tf-sweep,.tf-ping,.tf-shine{opacity:0}}
